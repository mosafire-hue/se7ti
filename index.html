<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d9488">
<title>صحتي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f0fdfa;color:#1e293b;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
h1{color:#0f766e;font-size:1.8rem}
p{color:#64748b;font-size:.9rem;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab{flex:1;padding:12px;border:none;background:transparent;color:#64748b;font-size:1rem;border-radius:8px;cursor:pointer;font-weight:600}
.tab.active{background:#0d9488;color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #ccfbf1}
.card-title{font-size:1.1rem;color:#0f766e;margin-bottom:14px;font-weight:700}
.form-group{margin-bottom:14px}
label{display:block;margin-bottom:5px;font-weight:600;font-size:.95rem}
.hint{font-size:.78rem;color:#64748b;margin-top:3px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid #ccfbf1;border-radius:10px;font-size:1rem;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0d9488}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;background:#0d9488;color:#fff}
.btn:hover{background:#0f766e}
.alert{background:#fff7ed;border-right:4px solid #f59e0b;padding:14px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.alert-icon{font-size:1.4rem}
.alert-title{font-weight:700;color:#9a3412;font-size:.95rem}
.alert-desc{font-size:.87rem;color:#c2410c;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.badge-day{background:#fee2e2;color:#991b1b}
.badge-week{background:#fef3c7;color:#92400e}
.badge-ok{background:#d1fae5;color:#065f46}
.empty{text-align:center;padding:40px 20px;color:#64748b}
.empty-icon{font-size:3rem;margin-bottom:10px;opacity:.5}
.item{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #e2e8f0;position:relative}
.item-name{font-weight:700;font-size:1.05rem}
.item-meta{font-size:.85rem;color:#64748b;line-height:1.7;margin-top:4px}
.item-rec{background:#eff6ff;border-right:3px solid #3b82f6;padding:8px 12px;border-radius:8px;margin-top:8px;font-size:.88rem;color:#1e40af}
.delete-btn{position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:#fff;padding:16px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-value{font-size:1.6rem;font-weight:800;color:#0d9488}
.stat-label{font-size:.85rem;color:#64748b;margin-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:50px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:1000}
#toast.show{opacity:1}
.info-box{background:#eff6ff;border-right:4px solid #3b82f6;padding:12px;border-radius:8px;margin-bottom:14px;font-size:.88rem;color:#1e40af}
.saved-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#0d9488;color:#fff;padding:4px 10px;border-radius:20px;font-size:.78rem;cursor:pointer}
.ac-list{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid #ccfbf1;border-radius:10px;max-height:180px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
.ac-list.show{display:block}
.ac-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:.95rem}
.ac-item:hover{background:#f0fdfa;color:#0f766e}
.ac-wrap{position:relative}
@media(max-width:480px){.container{padding:12px}.row{grid-template-columns:1fr}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="container">
<header><h1>صحتي</h1><p>تذكير ذكي بالفحوصات والأدوية</p></header>

<div class="stats">
<div class="stat"><div class="stat-value" id="stE">0</div><div class="stat-label">الفحوصات</div></div>
<div class="stat"><div class="stat-value" id="stM">0</div><div class="stat-label">الأدوية</div></div>
</div>

<div class="tabs">
<button class="tab active" onclick="go(0)">التنبيهات</button>
<button class="tab" onclick="go(1)">الفحوصات</button>
<button class="tab" onclick="go(2)">الأدوية</button>
</div>

<div id="p0" class="panel active">
<div class="card">
<div class="card-title">التنبيهات القادمة</div>
<div class="info-box">
📌 الفحص: تنبيه قبل <strong>أسبوع</strong> من الموعد<br>
📌 الدواء: تنبيه قبل <strong>يومين</strong> من الانتهاء
</div>
<div id="alerts"></div>
</div>
</div>

<div id="p1" class="panel">
<div class="card">
<div class="card-title">إضافة فحص</div>
<div class="form-group"><label>نوع الفحص *</label><input type="text" id="eName" placeholder="مثال: تحليل سكر صائم"></div>
<div class="form-group"><label>تاريخ آخر فحص *</label><input type="date" id="eDate"></div>
<div class="form-group"><label>التكرار *</label><select id="eFreq"><option value="1">كل شهر</option><option value="2">كل شهرين</option><option value="3" selected>كل 3 أشهر</option><option value="6">كل 6 أشهر</option><option value="12">كل سنة</option></select></div>
<div class="form-group"><label>تاريخ الموعد القادم (اختياري)</label><input type="date" id="eNext"><div class="hint">إذا حدده الطبيب، اكتبه هنا</div></div>
<div class="form-group"><label>توصية الطبيب (اختياري)</label><textarea id="eRec" placeholder="مثال: تحليل دم + أشعة..."></textarea></div>
<button class="btn" onclick="saveExam()">حفظ الفحص</button>
</div>
<div id="eList"></div>
</div>

<div id="p2" class="panel">
<div class="card">
<div class="card-title">إضافة دواء</div>
<div class="form-group"><label>اسم الدواء *</label><div class="ac-wrap"><input type="text" id="mName" placeholder="اكتب اسم الدواء..." autocomplete="off" oninput="ac()" onblur="setTimeout(hideAC,200)"><div class="ac-list" id="acList"></div></div><div class="saved-chips" id="chips"></div></div>
<div class="row"><div class="form-group"><label>تاريخ البدء *</label><input type="date" id="mStart"></div><div class="form-group"><label>عدد العلب *</label><input type="number" id="mBox" value="1" min="1"></div></div>
<div class="row"><div class="form-group"><label>حبات كل علبة *</label><input type="number" id="mPer" placeholder="30" min="1"></div><div class="form-group"><label>الجرعة اليومية *</label><input type="number" id="mDose" placeholder="2" min="1"></div></div>
<button class="btn" onclick="saveMed()">حفظ الدواء</button>
</div>
<div id="mList"></div>
</div>
</div>

<div id="toast"></div>

<script>
// ===== التبويبات =====
function go(n){
  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  for(var i=0; i<3; i++){
    tabs[i].className = (i===n) ? 'tab active' : 'tab';
    panels[i].style.display = (i===n) ? 'block' : 'none';
  }
  try{ render(); }catch(e){}
}

// ===== البيانات =====
var KEY = 'se7ti_v11';
var D = {exams:[], meds:[], names:[]};

function load(){
  var r = localStorage.getItem(KEY);
  if(r) D = JSON.parse(r);
  render();
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(D));
  render();
}
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m;
  t.className = 'show';
  setTimeout(function(){ t.className = ''; }, 2500);
}

// ===== التواريخ - أرقام إنجليزية + أشهر إنجليزية =====
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function today(){ return new Date().toISOString().split('T')[0]; }
function addDays(ds,d){ var x=new Date(ds); x.setDate(x.getDate()+d); return x.toISOString().split('T')[0]; }
function addMonths(ds,m){ var x=new Date(ds); x.setMonth(x.getMonth()+parseInt(m)); return x.toISOString().split('T')[0]; }
function dayDiff(f,t){ return Math.ceil((new Date(t)-new Date(f))/(864e5)); }

function fmtDate(d){
  var x = new Date(d);
  var day = x.getDate();
  var month = MONTHS[x.getMonth()];
  var year = x.getFullYear();
  return day + ' ' + month + ' ' + year;
}

// ===== الإشعارات =====
function reqNotify(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}
function sendNotify(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification(title, {body: body, icon: 'https://cdn-icons-png.flaticon.com/512/2964/2964514.png'});
  }
}
function checkNotify(){
  var msgs = [];
  D.meds.forEach(function(m){
    var en = addDays(m.start, m.days), rm = dayDiff(today(), en);
    if(rm <= 0) msgs.push('دواء '+m.name+' انتهى!');
    else if(rm === 1) msgs.push('دواء '+m.name+' ينتهي غداً');
  });
  D.exams.forEach(function(e){
    var nx = nextExam(e), rm = dayDiff(today(), nx);
    if(rm <= 0) msgs.push('فحص '+e.name+' متأخر!');
    else if(rm === 1) msgs.push('فحص '+e.name+' غداً');
  });
  if(msgs.length){
    sendNotify('صحتي - تنبيه عاجل', msgs.join(' / '));
  }
}

// ===== الفحوصات =====
function saveExam(){
  var n = document.getElementById('eName').value.trim();
  var d = document.getElementById('eDate').value;
  var f = document.getElementById('eFreq').value;
  var ne = document.getElementById('eNext').value;
  var rc = document.getElementById('eRec').value.trim();
  if(!n || !d) return toast('أكمل الحقول الإلزامية');
  D.exams.push({id:Date.now(), name:n, date:d, freq:f, next:ne, rec:rc});
  save();
  document.getElementById('eName').value='';
  document.getElementById('eDate').value='';
  document.getElementById('eNext').value='';
  document.getElementById('eRec').value='';
  toast('تم حفظ الفحص');
}
function delExam(id){
  D.exams = D.exams.filter(function(e){ return e.id !== id; });
  save();
  toast('تم الحذف');
}
function nextExam(e){ return e.next || addMonths(e.date, e.freq); }

// ===== الأدوية =====
function saveMed(){
  var n = document.getElementById('mName').value.trim();
  var b = parseInt(document.getElementById('mBox').value) || 1;
  var p = parseInt(document.getElementById('mPer').value);
  var d = parseInt(document.getElementById('mDose').value);
  var s = document.getElementById('mStart').value || today();
  if(!n || !p || !d) return toast('أكمل جميع الحقول');
  var total = b * p;
  var days = Math.floor(total / d);
  D.meds.push({id:Date.now(), name:n, boxes:b, perBox:p, total:total, dose:d, start:s, days:days});
  if(D.names.indexOf(n) === -1) D.names.push(n);
  save();
  document.getElementById('mName').value='';
  document.getElementById('mBox').value='1';
  document.getElementById('mPer').value='';
  document.getElementById('mDose').value='';
  document.getElementById('mStart').value='';
  hideAC();
  toast('تم حفظ الدواء');
}
function delMed(id){
  D.meds = D.meds.filter(function(m){ return m.id !== id; });
  save();
  toast('تم الحذف');
}

// ===== الإكمال التلقائي =====
function ac(){
  var v = document.getElementById('mName').value.trim();
  var lst = document.getElementById('acList');
  if(!v){ hideAC(); return; }
  var m = D.names.filter(function(n){ return n.indexOf(v) !== -1; });
  if(!m.length){ hideAC(); return; }
  lst.innerHTML = m.map(function(n){
    return '<div class="ac-item" onclick="pickName(\''+n.replace(/\'/g,"\\'")+'\')">'+n+'</div>';
  }).join('');
  lst.className = 'ac-list show';
}
function hideAC(){ document.getElementById('acList').className = 'ac-list'; }
function pickName(n){ document.getElementById('mName').value = n; hideAC(); }
function renderChips(){
  var c = document.getElementById('chips');
  if(!D.names.length){ c.innerHTML = ''; return; }
  c.innerHTML = '<div class="hint" style="width:100%;margin-bottom:4px;">أدوية مسجلة:</div>' +
    D.names.map(function(n){ return '<span class="chip" onclick="pickName(\''+n.replace(/\'/g,"\\'")+'\')">'+n+'</span>'; }).join('');
}

// ===== العرض =====
function render(){
  document.getElementById('stE').textContent = D.exams.length;
  document.getElementById('stM').textContent = D.meds.length;
  renderExams();
  renderMeds();
  renderAlerts();
  renderChips();
}
function renderExams(){
  var c = document.getElementById('eList');
  if(!D.exams.length){ c.innerHTML = '<div class="empty"><div class="empty-icon">🩺</div>لا توجد فحوصات</div>'; return; }
  c.innerHTML = D.exams.map(function(e){
    var nx = nextExam(e);
    var rm = dayDiff(today(), nx);
    var bg = rm<=7 ? '<span class="badge badge-day">قريب</span>' : '<span class="badge badge-ok">بعيد</span>';
    var nl = e.next ? 'موعد محدد' : 'حساب تلقائي';
    var rc = e.rec ? '<div class="item-rec">📝 '+e.rec+'</div>' : '';
    return '<div class="item"><button class="delete-btn" onclick="delExam('+e.id+')">×</button><div class="item-name">'+e.name+' '+bg+'</div><div class="item-meta">📅 آخر فحص: '+fmtDate(e.date)+'<br>🔁 كل '+e.freq+' أشهر<br>'+nl+': '+fmtDate(nx)+' ('+(rm<=0?'متأخر!':rm+' يوم')+')</div>'+rc+'</div>';
  }).join('');
}
function renderMeds(){
  var c = document.getElementById('mList');
  if(!D.meds.length){ c.innerHTML = '<div class="empty"><div class="empty-icon">💊</div>لا توجد أدوية</div>'; return; }
  c.innerHTML = D.meds.map(function(m){
    var en = addDays(m.start, m.days);
    var rm = dayDiff(today(), en);
    var bg = rm<=2 ? '<span class="badge badge-day">ينفذ!</span>' : rm<=7 ? '<span class="badge badge-week">أسبوع</span>' : '<span class="badge badge-ok">متوفر</span>';
    return '<div class="item"><button class="delete-btn" onclick="delMed('+m.id+')">×</button><div class="item-name">'+m.name+' '+bg+'</div><div class="item-meta">📦 '+m.boxes+' علبة × '+m.perBox+' حبة = <strong>'+m.total+' حبة</strong><br>💊 '+m.dose+'/يوم | تكفي <strong>'+m.days+' يوم</strong><br>📅 '+fmtDate(m.start)+' → '+fmtDate(en)+'<br>⏳ '+(rm<=0?'انتهى!':rm+' يوم')+'</div></div>';
  }).join('');
}
function renderAlerts(){
  var c = document.getElementById('alerts'), al = [];
  D.exams.forEach(function(e){
    var nx = nextExam(e), d = dayDiff(today(), nx);
    if(d<=7 && d>0){
      var ds = 'الفحص القادم '+fmtDate(nx)+' --- '+d+' أيام. اذهب للطبيب لحجز الموعد'+(e.rec?'<br>📝 '+e.rec:'');
      al.push({i:'🩺', t:'فحص '+e.name, d:ds, u:d<=3?'day':'week'});
    } else if(d<=0){
      var ds = 'متأخر! كان بتاريخ '+fmtDate(nx)+(e.rec?'<br>📝 '+e.rec:'');
      al.push({i:'⚠️', t:'فحص '+e.name+' متأخر', d:ds, u:'day'});
    }
  });
  D.meds.forEach(function(m){
    var en = addDays(m.start, m.days), d = dayDiff(today(), en);
    if(d<=2 && d>0) al.push({i:'💊', t:'دواء '+m.name+' ينفذ!', d:'يتبقى '+d+(d===1?' يوم':' أيام')+' --- تحضر لشراء العبوة', u:'day'});
    else if(d<=0) al.push({i:'⛔', t:'دواء '+m.name+' انتهى', d:'انتهى بتاريخ '+fmtDate(en), u:'day'});
  });
  if(D.meds.length > 1){
    var am = D.meds.filter(function(m){ return dayDiff(today(), addDays(m.start, m.days)) > 0; });
    if(am.length > 1){
      var md = am.map(function(m){ return {n:m.name, d:dayDiff(today(), addDays(m.start, m.days))}; });
      var sh = md.reduce(function(a,b){ return a.d < b.d ? a : b; });
      if(sh.d <= 7 && sh.d > 2){
        var om = md.filter(function(x){ return x.n !== sh.n && x.d > sh.d; });
        var ds = '"'+sh.n+'" الأقرب للانتهاء ('+sh.d+' يوم). اذهب للطبيب لطلب وصفة جديدة.'+(om.length?' (باقي: '+om.map(function(x){return x.n+' '+x.d+'ي';}).join('، ')+')':'');
        al.push({i:'📋', t:'تنبيه ذكي', d:ds, u:'week'});
      }
    }
  }
  if(!al.length){ c.innerHTML = '<div class="empty"><div class="empty-icon">🎉</div>لا توجد تنبيهات --- كل شيء تحت السيطرة!</div>'; return; }
  al.sort(function(a,b){ return a.u==='day' ? -1 : 1; });
  c.innerHTML = al.map(function(a){ return '<div class="alert"><div class="alert-icon">'+a.i+'</div><div><div class="alert-title">'+a.t+'</div><div class="alert-desc">'+a.d+'</div></div><span class="badge badge-'+a.u+'">'+(a.u==='day'?'عاجل':'تنبيه')+'</span></div>'; }).join('');
}

// ===== البدء =====
document.getElementById('eDate').value = today();
document.getElementById('mStart').value = today();
load();
reqNotify();
setTimeout(checkNotify, 1000);
if(D.exams.length || D.meds.length){
  setTimeout(function(){
    var a = document.querySelectorAll('.alert').length;
    if(a) toast('🔔 لديك '+a+' تنبيهات');
  }, 500);
}
</script>
</body>
</html>
